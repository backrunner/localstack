name: Validate macOS packaging

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrations:
    name: CLI and SDK (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/unplugin-localstack/package-lock.json
      - name: Test CLI and MCP
        if: matrix.node == '22'
        run: cargo test --locked --manifest-path cli/Cargo.toml
      - name: Test SDK and Vite lifecycle
        run: |
          npm --prefix packages/unplugin-localstack ci
          npm --prefix packages/unplugin-localstack test

  package:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Swift app and packaging failure gates
        run: |
          zsh -euo pipefail -c 'source Scripts/swift_env.sh; swift test'
          python3 -m unittest discover -s Tests/PackagingTests -v
      - name: Build and inspect universal development DMG
        env:
          SIGN_IDENTITY: '-'
          ARCHS: arm64 x86_64
        run: make package-dmg
