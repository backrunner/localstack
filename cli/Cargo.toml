[package]
name = "localstack"
version = "0.1.0"
edition = "2021"
description = "LocalStack local development service CLI and MCP server"
license = "MIT"

[[bin]]
name = "localstack"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
